<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0b0d14" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E" />
<title>OS 1000 대서사시</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d14; overflow: hidden; touch-action: none; }
  #app { width: 100vw; height: 100vh; }
  #typebox {
    --accent: #6c8cff;
    position: fixed; transform: translate(-50%, -50%); box-sizing: border-box;
    padding: 0 20px; text-align: center; font-weight: 600;
    background: #151924; color: #f2f4f8; caret-color: var(--accent);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 999px; outline: none;
    font-family: Pretendard, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; display: none; z-index: 5;
    transition: border-color .15s, box-shadow .15s;
  }
  #typebox:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
  #typebox::placeholder { color: #5b6375; }
</style>
</head>
<body>
<div id="app"></div>
<input id="typebox" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="여기에 입력" />
<script type="module" src="/src/main.js"></script>
</body>
</html>
